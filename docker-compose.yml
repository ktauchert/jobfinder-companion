# JobFinder infrastructure.
#
#   npm run infra:up                      # postgres + redis + ollama (CPU)
#   npm run infra:up:gpu                  # same, Ollama with NVIDIA GPU
#   docker compose --profile proxy up -d  # additionally start Caddy
#   docker compose down -v                # wipe all data
#
# The apps (apps/api, apps/web) run on the host via `npm run dev` during
# development. Values come from `.env` (see `.env.example`).

name: jobfinder

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobfinder-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-jobfinder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobfinder}
      POSTGRES_DB: ${POSTGRES_DB:-jobfinder}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once on first start of an empty data volume. Enables extensions only;
      # tables are owned by Drizzle migrations (packages/database).
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jobfinder} -d ${POSTGRES_DB:-jobfinder}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: jobfinder-redis
    restart: unless-stopped
    # BullMQ requires `noeviction`; otherwise Redis may drop queue state under memory pressure.
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: jobfinder-ollama
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      # Keep models loaded between requests; ingestion sends many small prompts.
      OLLAMA_KEEP_ALIVE: "30m"
      OLLAMA_NUM_PARALLEL: "${OLLAMA_NUM_PARALLEL:-1}"
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
  # One-shot: pulls the models the pipeline needs, then exits.
  ollama-pull:
    image: ollama/ollama:latest
    container_name: jobfinder-ollama-pull
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama pull "${OLLAMA_EMBED_MODEL:-nomic-embed-text}"
        ollama pull "${OLLAMA_EXTRACT_MODEL:-qwen2.5:3b}"
        echo "Models ready."
    restart: "no"

  # Reverse proxy for self-hosted deployments. Opt-in via `--profile proxy`.
  caddy:
    image: caddy:2-alpine
    container_name: jobfinder-caddy
    profiles: ["proxy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
      API_PORT: ${API_PORT:-3000}
      WEB_PORT: ${WEB_PORT:-5173}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    extra_hosts:
      # Lets Caddy reach api/web running on the host during development.
      - "host.docker.internal:host-gateway"

volumes:
  postgres-data:
  redis-data:
  ollama-data:
  caddy-data:
  caddy-config:
