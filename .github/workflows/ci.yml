name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Shared test env (no secrets). Matches .env.example defaults.
env:
  TURBO_TELEMETRY_DISABLED: "1"
  NODE_ENV: test
  LOG_LEVEL: info
  DATABASE_URL: postgresql://jobfinder:jobfinder@localhost:5432/jobfinder
  REDIS_URL: redis://localhost:6379
  OLLAMA_BASE_URL: http://localhost:11434
  OLLAMA_EMBED_MODEL: nomic-embed-text
  OLLAMA_EXTRACT_MODEL: qwen2.5:3b
  OLLAMA_NUM_PARALLEL: "1"
  INGEST_SERIAL: "true"
  INGEST_MAX_JOBS: "0"
  API_PORT: "3000"
  API_BASE_URL: http://localhost:3000
  CORS_ORIGIN: http://localhost:5173
  WEB_PORT: "5173"
  BA_CLIENT_ID: jobboerse-jobsuche
  ADZUNA_APP_ID: ""
  ADZUNA_APP_KEY: ""
  APIFY_TOKEN: ""

jobs:
  # No Docker services — fast gate on every push/PR.
  quality:
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run check

      - run: npm run build

  # Postgres + Redis service containers — mirrors local `test:integration`.
  # Ollama is NOT started in CI; integration tests mock extract/embed.
  # Live BA API, GPU Ollama, manual UI, and full ≥200-job runs stay local-only.
  integration:
    name: Migrate, seed, integration test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobfinder
          POSTGRES_PASSWORD: jobfinder
          POSTGRES_DB: jobfinder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobfinder -d jobfinder"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - run: npm ci

      - name: Enable Postgres extensions
        run: |
          until PGPASSWORD=jobfinder psql -h localhost -U jobfinder -d jobfinder -c 'select 1' >/dev/null 2>&1; do sleep 1; done
          # Service containers skip docker/init.sql; enable the same extensions here.
          PGPASSWORD=jobfinder psql -h localhost -U jobfinder -d jobfinder -v ON_ERROR_STOP=1 -f docker/init.sql

      - name: Build packages required by integration tests
        run: npm run build --workspace @jobfinder/types --workspace @jobfinder/database

      - run: npm run db:migrate

      - run: npm run db:seed

      - run: npm run test:integration
